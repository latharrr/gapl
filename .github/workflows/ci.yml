name: CI

on:
  push:
    branches: [master, redesign-pnr]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint src
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Test
        run: npm test
      - name: Build
        run: npx next build
